plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hush.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hush.tv'
        minSdk 23
        targetSdk 36
        versionCode 8
        versionName '1.5.1'
    }

    // Public, reproducible sideload key. It is intentionally committed so
    // every build and release is signed with the same certificate.
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        // Debug and release share the repository's fixed debug key.
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
